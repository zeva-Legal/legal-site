<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeva legal documents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #FCF9F3; color: #1C1C18; font-family: Manrope, sans-serif; }
    main { width: min(640px, calc(100% - 40px)); margin: 72px auto; }
    p.kicker { color: #99452D; font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
    h1 { font-family: Newsreader, Georgia, serif; font-size: 48px; margin: 0 0 8px; }
    p.lead { color: #4E4540; }
    ul { list-style: none; padding: 0; }
    a.card { display: block; background: #fff; border: 1px solid #E3DED4; border-radius: 20px; padding: 18px 20px; margin: 12px 0; color: #140C07; text-decoration: none; }
    a.card strong { font-family: Newsreader, Georgia, serif; font-size: 24px; display: block; }
    a.card span { color: #4E4540; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Lifefolio · Zeva</p>
    <h1>Legal documents</h1>
    <p class="lead">Terms of Service and Privacy Policy for the Zeva app.</p>
    <ul>
      <li><a class="card" href="zeva/terms/"><strong>Terms of Service</strong><span>Accounts, Card Credits, and use of the journal.</span></a></li>
      <li><a class="card" href="zeva/privacy/"><strong>Privacy Policy</strong><span>Pages, photographs, dictation, and purchases.</span></a></li>
    </ul>
  </main>
</body>
</html>
